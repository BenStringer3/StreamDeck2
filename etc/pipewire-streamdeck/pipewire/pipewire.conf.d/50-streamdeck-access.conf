# Streamdeck PipeWire instance: grant unrestricted access to all clients so that
# Pulse clients (Sunshine) can perform set-default-sink and other metadata operations
# without a session manager (WirePlumber).
# access.legacy = true gives every client "unrestricted" by default (deprecated but
# required when Pulse clients need metadata permission and no session manager runs).
# Do not set access.socket when using access.legacy (module rejects the combination).
module.access.args = {
    access.legacy = true
}
