# Capture method: wlroots screencopy protocol.
# Sunshine connects to the Sway Wayland socket and captures HEADLESS-1
# via zwlr_screencopy_manager. No DRM/KMS access needed.
capture = wlroots #TODO

# Select the wlroots output to capture.
# Without this, Sunshine may fail to pick a display in headless Sway and abort
# early with "Unable to initialize capture method" / "Unable to find display".
output_name = HEADLESS-1

# Encoder: NVIDIA NVENC hardware encoding.
encoder = nvenc

# Force Sunshine to use the NVIDIA 3090 Ti for NVENC (PCI bus id).
adapter_name = 00000000:01:00.0

# Note: resolutions option removed - not supported in current Sunshine version.
# Resolution is controlled by Sway output configuration (1280x800@60Hz).
