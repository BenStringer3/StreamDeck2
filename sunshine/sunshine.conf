# Capture method: X11 capture from dummy display
# Sunshine captures from the :99 X display using XCB
capture = x11

# X11 display to capture from
x11_display = :99

# Encoder: NVIDIA NVENC hardware encoding via PRIME offload
encoder = nvenc

# Force Sunshine to use the NVIDIA 3090 Ti for NVENC (PCI bus id)
adapter_name = 00000000:01:00.0

# Disable system tray (causes crashes in headless environment without GUI)
system_tray = 0

# Sunshine web UI port (for configuration)
port = 47989

# Log directory
log_dir = /var/log/sunshine
