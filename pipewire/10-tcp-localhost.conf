# Allow the stream user (Sunshine) to capture audio from this user's PipeWire session
# over TCP localhost. Sunshine runs as a separate system user (STREAM_USER) and cannot
# access the per-user PipeWire Unix socket (/run/user/<uid>/pulse/native is mode 0700).
#
# Deployed by install.sh to:
#   ~/.config/pipewire/pipewire-pulse.conf.d/10-tcp-localhost.conf
#
# Sunshine's systemd unit sets PULSE_SERVER=tcp:127.0.0.1:4713 to use this.
# See docs/audio-pipeline.md for the full audio architecture.
pulse.properties = {
    server.address = [
        "unix:native"
        {
            address = "tcp:127.0.0.1:4713"
            # "unrestricted" gives TCP clients full PipeWire graph access (load/unload
            # sink modules, set-default-sink). Sunshine needs this at stream start to
            # create its virtual sink and route audio. Safe: listener is 127.0.0.1 only,
            # same trust boundary as the Unix socket.
            # "restricted" would allow connect + list but deny set-default-sink → Sunshine
            # logs "Access denied" and the stream gets no audio.
            client.access = "unrestricted"
        }
    ]
}
